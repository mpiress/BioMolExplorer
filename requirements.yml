# Active Chimera preparation: docs/chimera_migration.md.
# Chimera is required by molecular preparation protocols.
# Native DMS surface port: docs/dms_migration.md (NumPy + SciPy; no DMS executable).
name: BioMolExplorer
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.12,<3.13
  - pip>=24
  - setuptools>=68
  - openbabel>=3.1.1,<3.2
  - chembl_webresource_client>=0.10.9,<0.11
  - numpy>=1.26.4,<2
  - pandas>=2.1.4,<3
  - rdkit>=2024.03,<2027
  - networkx>=3.3,<4
  - biopython>=1.84,<2
  - datasketch>=1.6.5,<2
  - seaborn>=0.13.2,<0.14
  - pymol-open-source>=3.0,<4
  - vina>=1.2.5,<1.3
  - requests>=2.31,<3
  - matplotlib>=3.8,<4
  - pillow>=10,<13
  - poppler
  - scipy>=1.11,<2
  - urllib3>=2,<3
  - pip:
    # Python ligand adapter; Gemmi is imported by Meeko, including ligand APIs.
    - meeko>=0.7.1,<0.8
    - gemmi>=0.7,<0.8
    - rcsbsearchapi==1.6.0
    - flet==1.0.3
    - flet-web==1.0.3
