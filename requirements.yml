# Active Chimera preparation: docs/chimera_migration.md.
# Chimera is required by molecular preparation protocols.
# Native Amber Score uses the DOCK6 6.11 bundle; no standalone AmberTools environment.
# Native DMS surface port: docs/dms_migration.md (NumPy + SciPy; no DMS executable).
name: BioMolExplorer
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.3
  - pip=26.2
  - openbabel=3.1.1
  - numpy=1.26.4
  - pandas=2.1.4
  - rdkit=2023.09.6
  - networkx=3.3
  - biopython=1.84
  - datasketch=1.6.5
  - seaborn=0.13.2
  - pymol-open-source=3.0.0
  - vina=1.2.5
  - requests=2.34.2
  - matplotlib=3.10.9
  - pillow=12.3.0
  - poppler=24.04.0
  - scipy=1.17.1
  - urllib3=2.7.0
  - setuptools=83.0.0
  - pip:
    - meeko>=0.7.1,<0.8
    - gemmi>=0.7,<0.8
    - rcsbsearchapi==1.6.0
    - flet[desktop]==1.0.3
    - flet-web==1.0.3
    - fastapi==0.142.2
    - uvicorn==0.54.0
    - websockets==17.2
    - --extra-index-url https://download.pytorch.org/whl/cpu
    - torch==2.8.0+cpu
    - admet-ai==2.0.1
