# Optional predictor only; never merge this environment with requirements.yml.
# Set BIOMOL_ADMET_PYTHON to this environment's Python, or use the existing
# scripts/setup_admet_ai.py installer for a repository-local CPU-only venv.
name: BioMolExplorer-ADMET
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.3
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cpu
    - torch==2.8.0+cpu
    - admet-ai==2.0.1
